<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Quantity Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('image.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-light text-white">

    <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">
        <div class="row w-100 justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                <div class="card p-4 shadow rounded-4 text-white bg-black bg-opacity-75">
                    <h4 class="text-center mb-3">Quantity Amount Calculator</h4>

                    <div class="mb-3">
                        <label for="AmountInput" class="form-label">Enter Amount:</label>
                        <input type="number" class="form-control" id="AmountInput" placeholder="e.g. 10000">
                    </div>

                    <div class="mb-3">
                        <label for="QuantityInput" class="form-label">Enter Product Quantity:</label>
                        <input type="number" class="form-control" id="QuantityInput" placeholder="e.g. 7">
                    </div>

                    <button id="button" class="btn btn-info w-100">Convert</button>

                    <div class="mt-3 text-center">
                        <p id="errMsg"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="quantity.js" type="module"></script>
</body>
</html>
